<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.2">
<title>오늘의 TBM 확인 · 벌목현장 안전관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1F3D2B;
    --forest-deep:#142A1D;
    --sage-tint:#E7EDE3;
    --paper:#F7F5F0;
    --card:#FFFFFF;
    --ink:#20241F;
    --ink-soft:#556151;
    --line:#DDE3D6;
    --orange:#E8622C;
    --orange-deep:#C24E1E;
    --green-ok:#2E7D4F;
    --green-tint:#E7F3EB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR',-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    font-size:19px;
    line-height:1.6;
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  #app{max-width:520px;margin:0 auto;padding:0 20px;}

  header{
    padding:calc(24px + env(safe-area-inset-top,0px)) 0 18px;
    text-align:center;
  }
  header .badge{
    display:inline-block;background:var(--forest);color:#fff;font-weight:800;
    font-size:14px;padding:7px 16px;border-radius:99px;margin-bottom:10px;
  }
  header h1{font-size:26px;font-weight:900;margin:0;color:var(--forest-deep);}
  header .date{font-size:16px;color:var(--ink-soft);margin-top:4px;font-weight:600;}

  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:18px;
    padding:22px;
    margin-bottom:16px;
  }
  .card h2{font-size:19px;font-weight:800;margin:0 0 12px;color:var(--forest-deep);}

  .summary-text{
    font-size:18px;line-height:1.8;white-space:pre-wrap;color:var(--ink);
  }
  .summary-empty{color:var(--ink-soft);font-size:16px;}

  .rule{
    display:flex;align-items:flex-start;gap:14px;
    padding:16px 0;border-bottom:1.5px solid var(--line);cursor:pointer;
  }
  .rule:last-child{border-bottom:none;}
  .rule .box{
    flex:none;width:34px;height:34px;border-radius:9px;border:2.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;
    color:transparent;margin-top:2px;
  }
  .rule.checked .box{background:var(--green-ok);border-color:var(--green-ok);color:#fff;}
  .rule .txt{font-size:18px;font-weight:600;line-height:1.5;}
  .rule.checked .txt{color:var(--forest-deep);}
  #summaryConfirm{margin-top:14px;padding-bottom:0;border-top:1.5px solid var(--line);}
  .sign-label{margin-top:18px;}
  .sign-pad{display:block;width:100%;height:170px;background:#fff;border:2px dashed var(--ink-soft);border-radius:12px;touch-action:none;cursor:crosshair;}
  .sign-clear{margin-top:10px;width:100%;background:var(--sage-tint);border:none;border-radius:12px;padding:13px;font-size:17px;font-weight:700;color:var(--forest-deep);font-family:inherit;cursor:pointer;}
  .submit-hint{font-size:16px;font-weight:600;color:var(--ink-soft);text-align:center;margin:0 0 12px;}

  label{display:block;font-size:16px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;}
  input[type=text]{
    width:100%;border:2px solid var(--line);border-radius:12px;padding:16px;
    font-size:20px;font-family:inherit;color:var(--ink);background:#fff;outline:none;
  }
  input[type=text]:focus{border-color:var(--forest);}

  .name-suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .name-chip{
    background:var(--sage-tint);border:none;border-radius:99px;padding:10px 16px;
    font-size:16px;font-weight:700;color:var(--forest-deep);cursor:pointer;
  }
  .name-chip.active{background:var(--forest);color:#fff;}

  .submit-btn{
    width:100%;border:none;border-radius:16px;padding:20px;
    font-size:21px;font-weight:900;color:#fff;background:var(--orange);
    cursor:pointer;
  }
  .submit-btn[disabled]{background:var(--line);color:var(--ink-soft);}
  .submit-btn:not([disabled]):active{background:var(--orange-deep);}

  .center-screen{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;
  }
  .center-screen .icon{font-size:64px;margin-bottom:16px;}
  .center-screen h1{font-size:24px;font-weight:900;margin:0 0 10px;color:var(--forest-deep);}
  .center-screen p{font-size:17px;color:var(--ink-soft);line-height:1.6;}

  [hidden]{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <div id="loadingScreen" class="center-screen">
    <div class="icon">⏳</div>
    <h1>불러오는 중...</h1>
  </div>

  <div id="errorScreen" class="center-screen" hidden>
    <div class="icon">😕</div>
    <h1>링크를 찾을 수 없어요</h1>
    <p>관리자에게 오늘의 새 링크를 다시 받아주세요.</p>
  </div>

  <div id="expiredScreen" class="center-screen" hidden>
    <div class="icon">📅</div>
    <h1>지난 TBM 링크예요</h1>
    <p>관리자에게 오늘의 새 링크를 받아주세요.</p>
  </div>

  <div id="mainScreen" hidden>
    <header>
      <div class="badge">오늘의 TBM 확인</div>
      <h1>작업 전 안전회의</h1>
      <div class="date" id="dateLabel">-</div>
    </header>

    <div class="card">
      <h2>📋 오늘의 교육내용</h2>
      <div class="summary-text" id="summaryText"><span class="summary-empty">관리자가 곧 내용을 올릴 예정이에요. 잠시만 기다려주세요.</span></div>
      <div class="rule" id="summaryConfirm" hidden>
        <div class="box">✓</div>
        <div class="txt">위 교육내용을 확인했습니다</div>
      </div>
    </div>

    <div class="card">
      <h2>✅ 안전수칙 확인</h2>
      <div id="rulesList"></div>
    </div>

    <div class="card">
      <h2>✍️ 이름 확인</h2>
      <label>본인 이름을 눌러 선택하거나 새로 입력해주세요</label>
      <div class="name-suggestions" id="nameSuggestions"></div>
      <input type="text" id="nameInput" placeholder="이름 입력" maxlength="20">
      <label class="sign-label" for="signPad">아래 칸에 손가락으로 서명해주세요</label>
      <canvas class="sign-pad" id="signPad" aria-label="서명 칸"></canvas>
      <button type="button" class="sign-clear" id="signClearBtn">서명 지우고 다시 쓰기</button>
    </div>

    <p class="submit-hint" id="submitHint"></p>
    <button class="submit-btn" id="submitBtn" disabled>확인 완료</button>
  </div>

  <div id="doneScreen" class="center-screen" hidden>
    <div class="icon">🙏</div>
    <h1>확인 완료됐습니다</h1>
    <p id="doneName">감사합니다. 오늘도 안전한 작업 되세요.</p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, onSnapshot, collection,
  serverTimestamp, setDoc, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDDB1aMKYLHwFkiEVhXu-sl0Ht6o_6Rugc",
  authDomain: "forest-tbm.firebaseapp.com",
  projectId: "forest-tbm",
  storageBucket: "forest-tbm.firebasestorage.app",
  messagingSenderId: "893926867733",
  appId: "1:893926867733:web:5f85a0cbf1a6b93feadf1c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const RULES = [
  "수구(밑등 자르는 각도)는 나무 지름의 1/4 이상, 30도 이상으로 만들겠습니다",
  "벌목 위험구역(나무 높이의 2배 이내)에는 다른 사람을 접근시키지 않겠습니다",
  "다른 나무에 걸리거나 받쳐진 나무는 함부로 벌목하지 않겠습니다",
  "작업 전 대피로와 대피장소를 미리 확인해두겠습니다",
  "안전모, 안전화 등 보호구를 반드시 착용하겠습니다",
];

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const sessionId = params.get("session");

const checked = new Array(RULES.length).fill(false);
let selectedName = "";
let currentSummary = "";
let currentVersion = 0;
let summaryConfirmed = false;
let signed = false;

function show(id){
  ["loadingScreen","errorScreen","expiredScreen","mainScreen","doneScreen"].forEach(x => $(x).hidden = (x !== id));
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

// 이름은 저장 경로에도 쓰이므로 "/"는 빼고, 띄어쓰기는 한 칸으로 맞춰요.
function normalizeName(s){
  return String(s || "").replace(/\//g, "").replace(/\s+/g, " ").trim();
}

// "김 철수"와 "김철수"를 같은 사람으로 보고 한 번만 저장해요.
function completionId(name){
  return "n_" + encodeURIComponent(name.replace(/\s+/g, ""));
}

// ---------- 손가락 서명 ----------
function setupSignaturePad(){
  const canvas = $("signPad");
  const ctx = canvas.getContext("2d");
  let drawing = false;
  let lastX = 0;
  let lastY = 0;
  let padWidth = 0;

  function resizePad(){
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || rect.width === padWidth) return;
    padWidth = rect.width;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#111";
    signed = false;
    updateSubmitState();
  }

  function point(e){
    const rect = canvas.getBoundingClientRect();
    return [e.clientX - rect.left, e.clientY - rect.top];
  }

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    canvas.setPointerCapture?.(e.pointerId);
    drawing = true;
    [lastX, lastY] = point(e);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = "#111";
    ctx.fill();
    signed = true;
    updateSubmitState();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    e.preventDefault();
    const [x, y] = point(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    [lastX, lastY] = [x, y];
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach((type) => {
    canvas.addEventListener(type, () => { drawing = false; });
  });
  // 서명하는 동안 화면이 움직이지 않게 해요.
  canvas.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

  $("signClearBtn").onclick = () => {
    const ratio = canvas.width / (padWidth || 1);
    ctx.clearRect(0, 0, canvas.width / ratio, canvas.height / ratio);
    signed = false;
    updateSubmitState();
  };

  window.addEventListener("resize", resizePad);
  resizePad();
}

// 저장 용량을 줄이려고 작은 크기로 바꿔서 저장해요.
function signatureDataUrl(){
  const source = $("signPad");
  // 서명이 칸 안에서 작게 보이지 않도록 쓴 부분만 잘라서 저장해요.
  const pixels = source.getContext("2d").getImageData(0, 0, source.width, source.height).data;
  let left = source.width, right = -1, top = source.height, bottom = -1;
  for (let y = 0; y < source.height; y++) {
    for (let x = 0; x < source.width; x++) {
      if (pixels[(y * source.width + x) * 4 + 3] > 0) {
        if (x < left) left = x;
        if (x > right) right = x;
        if (y < top) top = y;
        if (y > bottom) bottom = y;
      }
    }
  }
  if (right < 0) { left = 0; top = 0; right = source.width - 1; bottom = source.height - 1; }
  const pad = 6;
  left = Math.max(0, left - pad);
  top = Math.max(0, top - pad);
  const cropWidth = Math.min(source.width, right + pad + 1) - left;
  const cropHeight = Math.min(source.height, bottom + pad + 1) - top;

  const scale = Math.min(1, 400 / cropWidth);
  const out = document.createElement("canvas");
  out.width = Math.max(1, Math.round(cropWidth * scale));
  out.height = Math.max(1, Math.round(cropHeight * scale));
  const ctx = out.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(source, left, top, cropWidth, cropHeight, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
}

function setSummaryConfirmed(value){
  summaryConfirmed = value;
  $("summaryConfirm").classList.toggle("checked", value);
  updateSubmitState();
}

async function main(){
  if (!sessionId) { show("errorScreen"); return; }

  const sessionRef = doc(db, "sessions", sessionId);
  const snap = await getDoc(sessionRef);
  if (!snap.exists()) { show("errorScreen"); return; }

  const data = snap.data();
  // 지난 일지에 나중에 서명이 추가되지 않도록 오늘 링크만 받아요.
  if (data.date !== todayStr()) { show("expiredScreen"); return; }

  show("mainScreen");
  $("summaryConfirm").onclick = () => setSummaryConfirmed(!summaryConfirmed);
  $("dateLabel").textContent = new Date(data.date).toLocaleDateString("ko-KR", {year:"numeric",month:"long",day:"numeric",weekday:"long"});

  onSnapshot(sessionRef, (s) => {
    const d = s.data();
    if (!d) return;
    // 관리자가 공개한 내용만 보여줘요.
    const nextSummary = (d.publishedSummary || "").trim();
    currentVersion = d.publishedVersion || 0;
    $("summaryText").innerHTML = nextSummary
      ? escapeHtml(nextSummary)
      : '<span class="summary-empty">관리자가 곧 내용을 올릴 예정이에요. 잠시만 기다려주세요.</span>';
    // 교육내용이 바뀌면 바뀐 내용을 다시 확인하도록 체크를 풀어요.
    if (nextSummary !== currentSummary) {
      currentSummary = nextSummary;
      $("summaryConfirm").hidden = !currentSummary;
      setSummaryConfirmed(false);
    }
  });

  renderRules();
  setupSignaturePad();
  updateSubmitState();
  await loadNameSuggestions();
  setupNameInput();
  $("submitBtn").onclick = submit;
}

function renderRules(){
  const wrap = $("rulesList");
  wrap.innerHTML = RULES.map((r, i) => `
    <div class="rule" data-i="${i}">
      <div class="box">✓</div>
      <div class="txt">${escapeHtml(r)}</div>
    </div>
  `).join("");
  wrap.querySelectorAll(".rule").forEach(el => {
    el.onclick = () => {
      const i = parseInt(el.dataset.i, 10);
      checked[i] = !checked[i];
      el.classList.toggle("checked", checked[i]);
      updateSubmitState();
    };
  });
}

async function loadNameSuggestions(){
  try {
    const snap = await getDocs(collection(db, "workerNames"));
    const names = snap.docs.map(d => d.id).sort((a,b)=>a.localeCompare(b,"ko"));
    const wrap = $("nameSuggestions");
    wrap.innerHTML = names.map(n => `<button type="button" class="name-chip" data-name="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join("");
    wrap.querySelectorAll(".name-chip").forEach(btn => {
      btn.onclick = () => {
        wrap.querySelectorAll(".name-chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedName = btn.dataset.name;
        $("nameInput").value = selectedName;
        updateSubmitState();
      };
    });
  } catch(e){ console.error(e); }
}

function setupNameInput(){
  $("nameInput").addEventListener("input", () => {
    selectedName = normalizeName($("nameInput").value);
    document.querySelectorAll(".name-chip").forEach(b => b.classList.toggle("active", b.dataset.name === selectedName));
    updateSubmitState();
  });
}

function updateSubmitState(){
  const allChecked = checked.every(Boolean);
  const hasName = normalizeName(selectedName).length > 0;
  $("submitBtn").disabled = !(currentSummary && summaryConfirmed && allChecked && hasName && signed);

  // 버튼이 왜 안 눌리는지 알 수 있게 남은 일을 하나씩 알려줘요.
  let hint = "";
  if (!currentSummary) hint = "교육내용이 올라오면 확인할 수 있어요";
  else if (!summaryConfirmed) hint = "교육내용을 읽고 확인 칸을 눌러주세요";
  else if (!allChecked) hint = "안전수칙을 모두 눌러주세요";
  else if (!hasName) hint = "이름을 입력해주세요";
  else if (!signed) hint = "서명 칸에 서명해주세요";
  $("submitHint").textContent = hint;
}

async function submit(){
  if ($("submitBtn").disabled) return;
  $("submitBtn").disabled = true;
  $("submitBtn").textContent = "저장 중...";
  const name = normalizeName(selectedName);
  try {
    const completionRef = doc(db, "sessions", sessionId, "completions", completionId(name));
    const existing = await getDoc(completionRef);
    // 같은 내용을 이미 확인했으면 그대로 두고, 내용이 바뀌었으면 새로 확인한 기록으로 저장해요.
    if (existing.exists() && (existing.data().summaryVersion || 0) === currentVersion) {
      $("doneName").textContent = `${name}님은 이미 확인하셨어요. 오늘도 안전한 작업 되세요.`;
      show("doneScreen");
      return;
    }
    await setDoc(completionRef, {
      name,
      checkedItems: checked,
      summaryConfirmed: true,
      summaryVersion: currentVersion,
      signature: signatureDataUrl(),
      completedAt: serverTimestamp(),
    });
    // 이름 버튼 저장에 실패해도 확인 기록은 이미 남았으니 완료로 처리해요.
    try {
      await setDoc(doc(db, "workerNames", name), { updatedAt: serverTimestamp() }, { merge: true });
    } catch (err) { console.error(err); }
    $("doneName").textContent = `${name}님, 확인 감사합니다. 오늘도 안전한 작업 되세요.`;
    show("doneScreen");
  } catch(e){
    console.error(e);
    $("submitBtn").disabled = false;
    $("submitBtn").textContent = "확인 완료";
    alert("저장 중 문제가 생겼어요. 다시 시도해주세요.");
  }
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

main();
</script>
</body>
</html>
